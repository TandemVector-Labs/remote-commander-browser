name: QA Linux staged upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/upgrade-local.py
      - test/test_local_upgrade.py
      - .github/workflows/qa-linux-upgrade.yml

permissions:
  contents: read

jobs:
  linux-upgrade-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request source
        uses: actions/checkout@v4
      - name: Confirm Python and Linux POSIX environment
        run: |
          python3 --version
          test "$(uname -s)" = Linux
      - name: Validate syntax
        run: python3 -B -m py_compile scripts/upgrade-local.py test/test_local_upgrade.py
      - name: Run reversible upgrade and rollback unit fixtures
        run: python3 -B test/test_local_upgrade.py -v
