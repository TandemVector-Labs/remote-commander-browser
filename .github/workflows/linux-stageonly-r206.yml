name: Linux Browser StageOnly and profile-preservation guard R206

on:
  pull_request:
    paths:
      - 'scripts/install-local.sh'
      - 'test/linux-stageonly-r206.sh'
      - '.github/workflows/linux-stageonly-r206.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and profile-preservation CI test in fresh runner
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/install-local.sh
          bash -n test/linux-stageonly-r206.sh
          bash test/linux-stageonly-r206.sh
      - name: Upload synthetic fixture result (no real profile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r206-linux-browser-stageonly-qa
          path: ${{ runner.temp }}/R206_*.log
          if-no-files-found: warn
          retention-days: 7
